name: Documentation
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --global pnpm@8.10.5
      - run: pnpm install --frozen-lockfile
      - run: pnpm docs:check
      - run: pnpm docs:build
      - uses: actions/upload-artifact@v4
        with:
          name: restmodel-docs
          path: apps/docs/dist
